name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bootstrap Offline Scripture Database & Git Hook Safeguards
        run: |
          python3 ./bible init
          python3 tools/doctor.py --install-hooks

      - name: Verify Zero External Dependencies (Fast Pre-Commit Checks)
        run: |
          python3 tools/doctor.py --fast

      - name: Run Hermetic Unit Test Suite (Parallel)
        run: |
          python3 tools/test_runner.py -j 2 --verbose --no-warn-error || {
            echo "::error title=Hermetic Unit Tests Failed::Parallel test runner failed. Running verbose sequential diagnostics..."
            python3 -m unittest discover tests -v
            exit 1
          }

      - name: Run System Doctor & Full Diagnostic Suite
        run: |
          python3 tools/doctor.py

      - name: Run Sovereign Static Analysis & Linter
        run: |
          python3 tools/linter.py --verbose

      - name: Run Sovereign Performance Benchmarks & Statistical Profiler
        run: |
          python3 tools/benchmark.py --quick --compare-baseline

      - name: Run Sovereign Code Coverage Audit
        run: |
          python3 tools/coverage.py --threshold 70.0
